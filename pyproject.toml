[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "techsearch"
version = "1.0.0"
description = "Offline search and information-retrieval lab for web development"
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5", "fastapi>=0.115,<1", "httpx>=0.27,<1",
    "markdown-it-py>=3,<5", "numpy>=1.26,<3", "pydantic>=2.7,<3", "python-dotenv>=1,<2",
    "PyYAML>=6,<7", "requests>=2.31,<3", "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
dense = ["sentence-transformers>=3,<6", "huggingface-hub>=0.23,<2"]
research = ["scipy>=1.12,<2", "scikit-learn>=1.4,<2"]
test = ["pytest>=8,<10", "pytest-playwright>=0.5,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["browser: requires an explicitly installed local Playwright browser"]
